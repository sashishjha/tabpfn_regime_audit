[project]
name = "tabpfn-regime-audit"
version = "0.1.0"
description = "Find silent label-regime breaks in time-stamped tabular data using TabPFN-3.5 as the reference model."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "tabpfn>=9.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regime_audit"]
